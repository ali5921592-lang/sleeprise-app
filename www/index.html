pejado.","No corras; el día seguirá tu ritmo.","Haz bien una sola cosa hoy, es suficiente.","Un buen día empieza con una buena respiración.","Sé amable contigo, el día es largo.","Puedes más de lo que creías ayer.","Lo que empiezas hoy será tu hábito mañana.","Una mañana tranquila construye un día fuerte.","Dedica tu energía a lo que te importa.","No necesitas ser perfecto para ganar el día.","Cada mañana es una página nueva y tú tienes la pluma.","Un poco de orden trae mucha calma.","Hoy: un poco más lento, un poco más atento."],de:["Ein kleiner Schritt heute, ein großer Unterschied morgen.","Ein ausgeruhter Kopf ist ein freier Weg.","Keine Eile; der Tag passt sich deinem Tempo an.","Mach heute eine Sache richtig, das genügt.","Ein guter Tag beginnt mit einem guten Atemzug.","Sei freundlich zu dir, der Tag ist lang.","Du kannst mehr, als du gestern dachtest.","Was du heute beginnst, wird morgen Gewohnheit.","Ein stiller Morgen baut einen starken Tag.","Gib deine Energie dem, was dir wichtig ist.","Du musst nicht perfekt sein, um den Tag zu gewinnen.","Jeder Morgen ist eine neue Seite, du hältst den Stift.","Ein wenig Ordnung bringt viel Ruhe.","Heute: etwas langsamer, etwas achtsamer."],fr:["Un petit pas aujourd'hui, une grande différence demain.","Un esprit reposé, c'est une route dégagée.","Ne te presse pas ; la journée suivra ton rythme.","Fais bien une seule chose aujourd'hui, cela suffit.","Une bonne journée commence par une bonne respiration.","Sois doux avec toi, la journée est longue.","Tu peux plus que tu ne le pensais hier.","Ce que tu commences aujourd'hui deviendra ton habitude.","Un matin calme construit une journée solide.","Donne ton énergie à ce qui compte pour toi.","Pas besoin d'être parfait pour réussir ta journée.","Chaque matin est une page neuve et tu tiens le stylo.","Un peu d'ordre apporte beaucoup de calme.","Aujourd'hui : un peu plus lent, un peu plus attentif."],pt:["Um pequeno passo hoje, uma grande diferença amanhã.","Uma mente descansada é um caminho livre.","Sem pressa; o dia acompanha o seu ritmo.","Faça bem uma única coisa hoje, já basta.","Um bom dia começa com uma boa respiração.","Seja gentil consigo, o dia é longo.","Você consegue mais do que pensava ontem.","O que você começa hoje vira hábito amanhã.","Uma manhã tranquila constrói um dia forte.","Dê sua energia ao que importa para você.","Você não precisa ser perfeito para vencer o dia.","Cada manhã é uma página nova e a caneta é sua.","Um pouco de ordem traz muita calma.","Hoje: um pouco mais devagar, um pouco mais atento."],ru:["Маленький шаг сегодня — большая разница завтра.","Отдохнувший ум — это открытая дорога.","Не спеши; день подстроится под твой темп.","Сделай сегодня одно дело хорошо, этого довольно.","Хороший день начинается с хорошего вдоха.","Будь добр к себе, день длинный.","Ты можешь больше, чем думал вчера.","То, что начинаешь сегодня, завтра станет привычкой.","Тихое утро строит сильный день.","Отдавай энергию тому, что тебе важно.","Не нужно быть идеальным, чтобы выиграть день.","Каждое утро — новая страница, и перо у тебя.","Немного порядка приносит много спокойствия.","Сегодня: чуть медленнее, чуть внимательнее."],ar:["خطوة صغيرة اليوم، فارق كبير غدًا.","العقل المرتاح طريق واضح.","لا تستعجل؛ سيسير اليوم على إيقاعك.","أتقن عملًا واحدًا اليوم، ويكفي.","اليوم الجميل يبدأ بنَفَس هادئ.","كن لطيفًا مع نفسك، اليوم طويل.","تستطيع أكثر مما ظننت بالأمس.","ما تبدأه اليوم يصير عادتك غدًا.","صباح هادئ يبني يومًا قويًا.","اصرف طاقتك على ما يهمّك.","لا يلزمك الكمال لتكسب يومك.","كل صباح صفحة جديدة، والقلم بيدك.","قليل من النظام يجلب كثيرًا من الطمأنينة.","اليوم: أبطأ قليلًا، وأكثر انتباهًا."],ja:["今日の小さな一歩が、明日の大きな違いに。","休まった心は、開けた道になります。","急がなくていい。一日はあなたの速さに合わせます。","今日はひとつを丁寧に。それで十分です。","良い一日は、良い呼吸から始まります。","自分に優しく。一日は長いのだから。","昨日思っていたより、あなたはできます。","今日始めたことが、明日の習慣になります。","静かな朝が、強い一日をつくります。","大切なことにエネルギーを使いましょう。","完璧でなくても、今日は勝てます。","毎朝は新しいページ。ペンはあなたの手に。","少しの秩序が、大きな安らぎを生みます。","今日は少しゆっくり、少していねいに。"],ko:["오늘의 작은 한 걸음이 내일의 큰 차이가 됩니다.","쉰   function start(){ensureSheet();setTimeout(()=>{loadProducts().then(render).catch(()=>render())},900)}

    });

    try{if(typeof I18N_EXT!=='undefined')baseSources.I18N_EXT=I18N_EXT;if(typeof I18N_OB!=='undefined')baseSources.I18N_OB=I18N_OB;if(typeof I18N_TD!=='undefined')baseSources.I18N_TD=I18N_TD;if(typeof I18N_TOUR!=='undefined')baseSources.I18N_TOUR=I18N_TOUR}catch(e){}
    Object.keys(baseSources).forEach(name=>{const source=baseSources[name];Object.keys(source).forEach(c=>{if(I18N[c])Object.assign(I18N[c],source[c])})});
    try{if(typeof CK!=='undefined')Object.keys(DATA.extra?.CK||{}).forEach(c=>{CK[c]=DATA.extra.CK[c]})}catch(e){}
    try{
      const legacyTargets={};
      try{if(typeof I18N_MODE!=='undefined')legacyTargets.I18N_MODE=I18N_MODE;if(typeof I18N_V11!=='undefined')legacyTargets.I18N_V11=I18N_V11;if(typeof I18N_A!=='undefined')legacyTargets.I18N_A=I18N_A;if(typeof I18N_ATM!=='undefined')legacyTargets.I18N_ATM=I18N_ATM;if(typeof I18N_ATM2!=='undefined')legacyTargets.I18N_ATM2=I18N_ATM2;if(typeof I18N_BABY!=='undefined')legacyTargets.I18N_BABY=I18N_BABY;if(typeof I18N_V17!=='undefined')legacyTargets.I18N_V17=I18N_V17;if(typeof I18N_VID!=='undefined')legacyTargets.I18N_VID=I18N_VID}catch(e){}
      const full=DATA.legacy?.full||{};Object.keys(full).forEach(name=>{const target=legacyTargets[name];if(!target)return;Object.keys(full[name]).forEach(c=>{target[c]=full[name][c]})});
      const zhOnly=DATA.legacy?.zh_only||{};Object.keys(zhOnly).forEach(name=>{const target=legacyTargets[name];if(target&&zhOnly[name].zh)target.zh=zhOnly[name].zh});
    }catch(e){console.warn('SleepRise v50 legacy locale',e)}
  }
  function updateV49(){
    const m=selected(DATA&&DATA.messages);if(!m)return;
    const head=q('#v49-settings .v49-settings-head b'),desc=q('#v49-settings .v49-settings-head small');if(head)head.textContent=m.settings;if(desc)desc.textContent=m.settingsDesc;
    [['v49SleepAmbient','sleepAmbient','sleepAmbientDesc'],['v49WakeAmbient','wakeAmbient','wakeAmbientDesc'],['v49VoiceGuide','voiceGuide','voiceGuideDesc']].forEach(([id,title,sub])=>{const el=q('#'+id);if(!el)return;const wrap=el.closest('.v49-setting-row');const spans=wrap?wrap.querySelectorAll('span b,span small'):[];if(spans[0])spans[0].textContent=m[title];if(spans[1])spans[1].textContent=m[sub]});
    const set=(sel,key)=>{const el=q(sel);if(el&&m[key])el.textContent=m[key]};
    set('#v49ExactAlarm','exactAlarm');set('#v49MixerOff','mixerOff');set('#v49AtmosphereOff','atmosphereOff');set('#v49WakeCard .v49-wake-kicker','dailyMotivation');set('#v49WakeCard .v49-wake-sub','scheduleAlarm');set('#v49WakeAddAlarm','addAlarm');
    const err=q('#bcHint')||q('#barcodeState');if(err&&/Kamera|barcode|barkod/i.test(err.textContent||''))err.textContent=m.cameraError;
  }
  function refresh(){
    try{addLanguages();merge();if(typeof applyI18n==='function')applyI18n();if(typeof renderLangModal==='function')renderLangModal();if(typeof renderLangMenu==='function')renderLangMenu();if(typeof window.SleepRiseProfessional?.refresh==='function')window.SleepRiseProfessional.refresh();if(typeof renderTones==='function')renderTones();updateV49();document.documentElement.lang=(LANGS.find(x=>x.c===current())||{}).loc||current();document.documentElement.dir=current()==='ar'?'rtl':'ltr'}catch(e){console.warn('SleepRise v50 locale refresh',e)}
  }
  async function boot(){
    try{if(!DATA){const r=await fetch('translations/sleeprise_v50_i18n.json',{cache:'no-store'});if(!r.ok)throw new Error('translation-bundle-'+r.status);DATA=await r.json()}addLanguages();merge();refresh();}catch(e){console.warn('SleepRise v50 translation bundle',e);addLanguages();try{renderLangModal();renderLangMenu()}catch(err){}}
  }
  document.addEventListener('click',e=>{const target=e.target.closest('#langGrid [data-l],#langMenu [data-l]');if(target)setTimeout(refresh,40)},true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
