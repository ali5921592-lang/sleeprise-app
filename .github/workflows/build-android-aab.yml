name: Build SleepRise Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android upload keystore’unu hazırla
        env:
          SLEEPRISE_UPLOAD_KEYSTORE_B64: ${{ secrets.SLEEPRISE_UPLOAD_KEYSTORE_B64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.SLEEPRISE_ANDROID_KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.SLEEPRISE_ANDROID_KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.SLEEPRISE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/android/sleeprise-upload-key.jks"
          rm -f "$KEYSTORE"
          if [ -n "${SLEEPRISE_UPLOAD_KEYSTORE_B64:-}" ] && printf '%s' "$SLEEPRISE_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE" 2>/dev/null && keytool -list -keystore "$KEYSTORE" -storepass "${EXISTING_STORE_PASSWORD:-}" -alias "${EXISTING_KEY_ALIAS:-}" >/dev/null 2>&1; then
            echo "SLEEPRISE_SIGNING_SOURCE=existing" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$EXISTING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$EXISTING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$EXISTING_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::Release signing secret unavailable; restoring the last verified SleepRise upload key backup."
            BACKUP_DIR="$RUNNER_TEMP/sleeprise-upload-key-backup"
            rm -rf "$BACKUP_DIR"
            if ! GH_TOKEN="${{ github.token }}" gh run download 32244934903 --repo "$GITHUB_REPOSITORY" --name sleeprise-upload-key-backup --dir "$BACKUP_DIR"; then
              echo "::error::No verified upload key is available. Refusing to generate a new key for an existing Play app."
              exit 1
            fi
            cp "$BACKUP_DIR/sleeprise-upload-key.jks" "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            test -s "$BACKUP_DIR/signing.env"
            cat "$BACKUP_DIR/signing.env" >> "$GITHUB_ENV"
            echo "SLEEPRISE_SIGNING_SOURCE=verified-backup" >> "$GITHUB_ENV"
            keytool -list -keystore "$KEYSTORE" -storepass "$(grep '^ANDROID_KEYSTORE_PASSWORD=' "$BACKUP_DIR/signing.env" | cut -d= -f2-)" -alias "$(grep '^ANDROID_KEY_ALIAS=' "$BACKUP_DIR/signing.env" | cut -d= -f2-)" >/dev/null 2>&1
          fi
          test -s "$KEYSTORE"

      - name: JavaScript bağımlılıklarını yükle
        run: pnpm install --frozen-lockfile

      - name: İlk Play yüklemesi için ağır video varlıklarını geçici çıkar
        run: |
          mv www/videos "$RUNNER_TEMP/sleeprise-videos"
          mkdir -p www/videos

      - name: Web varlıklarını Android projesine eşitle
        run: npx cap sync android

      - name: İmzalı release AAB derle
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/sleeprise-upload-key.jks
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="1.0"

      - name: İmzalı AAB artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: sleeprise-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Web video varlıklarını geri yükle
        if: always()
        run: |
          rm -rf www/videos
          if [ -d "$RUNNER_TEMP/sleeprise-videos" ]; then mv "$RUNNER_TEMP/sleeprise-videos" www/videos; fi

      - name: Keystore dosyasını temizle
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/android/sleeprise-upload-key.jks"
