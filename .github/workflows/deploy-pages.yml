name: Deploy SleepRise store pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: GitHub Pages ayarlarını kur
        uses: actions/configure-pages@v5
      - name: Statik sayfaları paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: GitHub Pages’e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
