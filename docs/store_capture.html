<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SleepRise Store Capture</title>
<style>
:root{--ink:#17233b;--muted:#5d6b85;--green:#00a98e;--purple:#5a57ff;--orange:#ff9f1c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf1fb;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:linear-gradient(145deg,#dff8f1 0%,#f2eaff 47%,#fff0c8 100%)}.stage::before,.stage::after{content:"";position:absolute;border-radius:999px;filter:blur(2px);opacity:.72}.stage::before{width:480px;height:480px;right:-140px;top:-80px;background:radial-gradient(circle,#ffdb7a 0 28%,rgba(255,219,122,.12) 65%,transparent 70%)}.stage::after{width:380px;height:380px;left:-150px;bottom:-90px;background:radial-gradient(circle,#8fe9d5 0 22%,rgba(143,233,213,.12) 64%,transparent 70%)}.copy{position:absolute;left:92px;right:92px;top:112px;z-index:2}.eyebrow{font-weight:900;letter-spacing:.18em;color:var(--green);font-size:21px;text-transform:uppercase}.title{font-weight:950;letter-spacing:-.07em;font-size:72px;line-height:.98;margin:22px 0 20px;max-width:870px}.sub{font-size:26px;line-height:1.3;color:var(--muted);max-width:820px;margin:0}.tag{display:inline-flex;align-items:center;margin-top:28px;padding:11px 17px;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.92);font-size:19px;font-weight:850}.phone{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:550px;width:486px;height:1055px;padding:13px;background:#17233b;border-radius:58px;box-shadow:0 32px 80px rgba(23,35,59,.30),0 5px 0 rgba(23,35,59,.08)}.phone::before{content:"";position:absolute;z-index:4;left:50%;top:18px;transform:translateX(-50%);width:122px;height:27px;background:#17233b;border-radius:20px}.screen{width:460px;height:1029px;overflow:hidden;border-radius:45px;background:#f9fbff}.screen iframe{display:block;width:430px;height:932px;border:0;transform:scale(1.07);transform-origin:top left}.foot{position:absolute;z-index:2;left:92px;right:92px;bottom:82px;display:flex;justify-content:space-between;gap:20px;color:rgba(23,35,59,.63);font-size:18px;font-weight:750}.brand{font-weight:950;letter-spacing:-.04em;color:var(--ink)}.small{font-size:18px}@media(max-width:1100px){.stage{transform-origin:top left;transform:scale(calc(100vw / 1080));}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="copy"><div class="eyebrow" id="eyebrow"></div><div class="title" id="title"></div><p class="sub" id="sub"></p><span class="tag" id="tag"></span></div>
  <div class="phone"><div class="screen"><iframe id="app" title="SleepRise app preview"></iframe></div></div>
  <div class="foot"><span class="brand">SleepRise</span><span class="small">Sleep better · wake ready</span></div>
</div>
<script>
(function(){
  const qs=new URLSearchParams(location.search),screen=qs.get('screen')||'wake';
  const copy={
    wake:['WAKE WITH INTENTION','Build a calmer morning','Plan your wake-up, choose a task and start the day on purpose.','Wake-up centre'],
    alarm:['SMART ALARM','Your alarm, your rules','Choose a powerful sound and a wake-up task that keeps you moving.','Strict task completion'],
    sleep:['NIGHT RHYTHM','Wind down with clarity','Sleep cycles, a calm bedtime plan and gentle guidance in one view.','Sleep routine'],
    relax:['RELAX YOUR WAY','A calmer space to rest','Mix sound, atmosphere and breathing with a timer that stops when you are ready.','Relax · sound · atmosphere'],
    analysis:['SLEEP INSIGHTS','Understand your nights','See your score, consistency, efficiency and trends without medical claims.','Wellness insights'],
    tasks:['WAKE-UP TASKS','Wake your brain, not the whole room','Typing and shake are free; optional Pro missions add more challenge.','Type · shake · math · memory'],
    paywall:['SLEEPSRISE PRO','Try the calm flow first','Seven days free when the store offer is available, then choose the plan that fits you.','No hidden close button · Later when you need it'],
    languages:['ONE APP · NINE LANGUAGES','Your rhythm, your language','Turkish, English, Spanish, German, French, Portuguese, Arabic, Chinese and Japanese.','Built for a global morning']
  }[screen]||[];
  document.getElementById('eyebrow').textContent=copy[0];document.getElementById('title').textContent=copy[1];document.getElementById('sub').textContent=copy[2];document.getElementById('tag').textContent=copy[3];
  const expired=screen==='paywall';
  localStorage.setItem('sf_lang','"en"');localStorage.setItem('sleeprise_trial_started_at_v63',String(Date.now()-(expired?8:0)*86400000));localStorage.removeItem('sleeprise_pro_active');localStorage.removeItem('sleeprise_pro');
  const frame=document.getElementById('app');frame.src='../www/index.html?storeCapture='+encodeURIComponent(screen);
  frame.addEventListener('load',()=>{
    const w=frame.contentWindow,d=w.document;
    setInterval(()=>{Array.from(d.querySelectorAll('button')).find(b=>['Skip','NOT NOW'].includes(b.textContent.trim()))?.click()},450);
    setTimeout(()=>{
      const gateEnglish=d.querySelector('#sr53GateGrid button:nth-child(2)');
      if(gateEnglish){gateEnglish.click();d.querySelector('#sr53GateGo')?.click();setTimeout(()=>{Array.from(d.querySelectorAll('button')).find(b=>b.textContent.trim()==='NOT NOW')?.click();setTimeout(()=>{Array.from(d.querySelectorAll('button')).find(b=>b.textContent.trim()==='Skip')?.click()},700)},700)}
      const click=sel=>d.querySelector(sel)?.click();
      if(screen==='sleep'){click('#modeSw [data-m="sleep"]');setTimeout(()=>click('button.tab[data-p="sleep"]'),300)}
      else if(screen==='alarm'||screen==='tasks'||screen==='paywall'){click('button.tab[data-p="alarm"]');if(screen==='tasks'||screen==='paywall'){setTimeout(()=>{click('#btnAdd');setTimeout(()=>{click('#fTask button[data-z="'+(screen==='paywall'?'math':'typing')+'"]')},700)},500)}}
      else if(screen==='relax'){click('button.tab[data-p="relax"]')}
      else if(screen==='analysis'){click('button.tab[data-p="stats"]')}
      else if(screen==='languages'){click('#btnLang')}
      else {click('button.tab[data-p="day"]')||click('button.tab[data-p="today"]')}
      if(screen==='paywall'){setTimeout(()=>{try{w.SleepRiseMonetization?.openPaywall?.()}catch(e){}},1500)}
    },5000);
  });
})();
</script>
</body></html>
